name: Upstream drift

on:
  schedule:
    # Every Monday 09:00 UTC.
    - cron: "0 9 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-drift
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          python-version: "3.13"
      - run: uv sync --all-groups --frozen
      - run: uv run python scripts/upstream_tool_inventory.py --create-issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
