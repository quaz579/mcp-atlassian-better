name: Bug report
description: Something isn't working as expected.
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the command/tool call, and a redacted config shape if relevant. Never paste a real token, hostname, project key, or issue key.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-atlassian-better version
      description: Output of `mcp-atlassian-better --version`, or the git ref you're on.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any relevant log output. This will be rendered as a code block, so no need for backticks.
      render: shell
    validations:
      required: false
